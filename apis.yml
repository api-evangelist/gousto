description: 'Gousto is a British meal-kit retailer founded in 2012 by Timo Boldt and James Carter and
  headquartered in Shepherd''s Bush, London. It delivers recipe boxes with pre-portioned fresh ingredients
  and step-by-step recipes to homes across the UK, using proprietary data science, ERP, courier-integration
  and warehouse-automation systems to run its subscription operation. A SoftBank Vision Fund portfolio
  company, Gousto does not publish a public developer API; this profile captures its public digital surface
  (website, engineering blog, GitHub organization, and coordinated vulnerability-disclosure program) for
  the API Evangelist network.'
